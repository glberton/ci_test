name: CI - Playwright Sem Docker

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    playwright-tests-no-docker:
        name: Executar testes Playwright sem Docker
        runs-on: ubuntu-latest
        
        steps:
            - name: Baixar código do repositório
              uses: actions/checkout@v6
            
            - name: Configurar Python 3.12
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Instalar Playwright, pytest e outras dependências do Python
              run: |
                  python -m pip install --upgrade pip
                  pip install --no-cache-dir -r requirements.txt

            - name: Instalar navegadores e dependências de SO
              run: python -m playwright install --with-deps

            - name: Preparar diretório de relatórios
              run: |
                mkdir -p reports
                rm -rf reports/*

            - name: Executar testes
              run: |
                  pytest

            - name: Publicar relatório HTML
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: reports/
                  if-no-files-found: warn
                  retention-days: 7
