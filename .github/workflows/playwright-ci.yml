name: Playwright CI Container oficial

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    testes_playwright_docker_oficial:
        name: Testes Playwright com Docker oficial
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright/python:v1.64.1
            # options: --user 1001
        
        steps:
            - name: Baixar código do repositório
              uses: actions/checkout@v6
            
            - name: Instalar dependências do Python
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            
            - name: Preparar diretório de relatórios
              run: |
                  mkdir -p reports
                  rm -rf reports/*
            
            - name: Executar testes do Playwright
              run: |
                  pytest
            
            - name: Publicar relatório HTML
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: reports/
                  if-no-files-found: warn
                  retention-days: 7
