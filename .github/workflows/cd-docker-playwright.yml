name: CD - Publicar Imagem Docker no GHCR

on:
    workflow_run:
        workflows: ["Playwright CI Container Oficial"]
        types:
            - completed
        branches: [ main ]

env:
    REGISTRY: ghrc.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read
    # packages: write

jobs:
    publish:
        name: Publicar imagem no GHRC
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        # Só publica se o CI tiver sido aprovado.
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'

        steps:
            - name: Baixar código do repositório
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha}}

            - name: Normalizar nome da imagem
              run: |
                  echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
                #   echo "IMAGE_NAME=ghrc.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_ENV

            - name: Configurar Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar no GHRC
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Criar tags e metadados
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha
                      type=raw,value=latest


            - name: Construir e publicar imagem
              uses: actions/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: $${{ steps.meta.outputs.tags}}
                  labels: ${{ steps.meta.outputs.labels }}
