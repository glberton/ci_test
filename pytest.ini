[pytest]
# Default pytest execution options
# addopts = -v --html=reports/tests_report.html --capture=tee-sys
# For "reports/tests_report_{timestamp}.html", its necessary to use conftest.py
addopts = -v --capture=tee-sys

# test discovery
testpaths = tests

# Enable logging
log_cli = true

# Minimum level of logging shown on pytest report (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

# Minimum level of logging shown on pytest terminal (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_cli_level = INFO

# Message format in the report
log_format = %(asctime)s [%(levelname)s] [%(filename)s] [%(funcName)s]:
    -   %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Message format in the terminal
log_cli_format = %(asctime)s [%(levelname)s] [%(filename)s] [%(funcName)s] %(message)s
log_cli_date_format = %H:%M:%S

# Custom Markers   (to avoid warnings of unknown markers.)
; markers =
;     smoke: quick tests for core functionality
;     regression: tests that verify existing functionality after changes
